<?xml version="1.0" encoding="UTF-8"?>
<!--
  LEDSpicer starter configuration for MiSTer with a GroovyGameGear LED-Wiz (32 outputs).

  Install once:  cp this file to /media/fat/linux/LEDSpicer/etc/ledspicer.conf
  Then tune the element names/groups to match your panel wiring.

  It lives on the SD card on purpose: the MiSTer root filesystem (linux.img) is
  mounted read-only and replaced by MiSTer updates, so /etc does not survive.

  userId/groupId are 0 because MiSTer runs everything as root.
  fps is 15: the build waits 10 ms between LED-Wiz packets (4 per frame), so a
  30 fps frame would overrun. Button LEDs do not need more.
-->
<LEDSpicer
	version="1.1"
	type="Configuration"
	fps="15"
	port="16161"
	colors="basicColors"
	logLevel="Info"
	userId="0"
	groupId="0"
>
	<devices>
		<!-- One single-colour element per LED-Wiz output, 1-32. -->
		<device name="LedWiz32" boardId="1">
			<element name="Out1" led="1" />
			<element name="Out2" led="2" />
			<element name="Out3" led="3" />
			<element name="Out4" led="4" />
			<element name="Out5" led="5" />
			<element name="Out6" led="6" />
			<element name="Out7" led="7" />
			<element name="Out8" led="8" />
			<element name="Out9" led="9" />
			<element name="Out10" led="10" />
			<element name="Out11" led="11" />
			<element name="Out12" led="12" />
			<element name="Out13" led="13" />
			<element name="Out14" led="14" />
			<element name="Out15" led="15" />
			<element name="Out16" led="16" />
			<element name="Out17" led="17" />
			<element name="Out18" led="18" />
			<element name="Out19" led="19" />
			<element name="Out20" led="20" />
			<element name="Out21" led="21" />
			<element name="Out22" led="22" />
			<element name="Out23" led="23" />
			<element name="Out24" led="24" />
			<element name="Out25" led="25" />
			<element name="Out26" led="26" />
			<element name="Out27" led="27" />
			<element name="Out28" led="28" />
			<element name="Out29" led="29" />
			<element name="Out30" led="30" />
			<element name="Out31" led="31" />
			<element name="Out32" led="32" />
		</device>
	</devices>

	<!-- A group named "All" containing every element is created automatically. -->
	<layout defaultProfile="default">
	</layout>

	<!-- processLookup: on MiSTer it watches the running core and asks the
	     daemon for a matching profile; runEvery is in milliseconds. -->
	<processLookup runEvery="500" />
</LEDSpicer>
