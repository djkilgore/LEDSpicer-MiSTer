name: Build LEDSpicer (MiSTer)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ledspicer-mister:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract build artifact
        run: |
          container=$(docker create ledspicer-mister:ci)
          docker cp "$container":/root/LEDSpicer.tar.gz ./LEDSpicer.tar.gz
          docker rm "$container"
          ls -lh ./LEDSpicer.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDSpicer-MiSTer
          path: LEDSpicer.tar.gz
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LEDSpicer.tar.gz
          generate_release_notes: true
